[project]
name = "eivlhole"
version = "0.2.0"
description = "Wormhole-style file transfer over SSH for protected networks, with scheduled unattended delivery."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eivind Teig" }]
keywords = ["ssh", "sftp", "file-transfer", "wormhole", "scheduler", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
]
dependencies = [
    "asyncssh>=2.19,<3",
    "typer>=0.15,<1",
    "textual>=3.0,<9",
    "holidays>=0.60,<1",
    "tomli-w>=1.1,<2",
    "platformdirs>=4.2,<5",
]

[project.urls]
Homepage = "https://github.com/eivl/eivlhole"
Repository = "https://github.com/eivl/eivlhole"
Issues = "https://github.com/eivl/eivlhole/issues"

[project.scripts]
eivlhole = "eivlhole.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eivlhole"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
